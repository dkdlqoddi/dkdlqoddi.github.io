<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>발표 기록 · dkdlqoddi</title>
  <meta name="description" content="dkdlqoddi의 발표자료 모음. 카드를 선택하면 해당 슬라이드로 이동합니다.">
  <meta property="og:title" content="발표 기록 · dkdlqoddi">
  <meta property="og:description" content="dkdlqoddi의 발표자료 모음">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e0e0e">
  <!-- CSS 도착 전 첫 페인트부터 어둡게 (흰 번쩍임 방지) -->
  <style>html { background: #0e0e0e; color-scheme: dark; }</style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0e0e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fcfcfb' stroke-width='2'/%3E%3Ccircle cx='25' cy='7' r='1.6' fill='%23fcfcfb'/%3E%3C/svg%3E">
  <!-- 동봉 Pretendard (base64 내장 — 외부 요청 0) -->
  <link rel="stylesheet" href="vendor/pretendard/pretendard.css">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

  <!-- 시그니처: 화면을 감싸는 계기판(HUD) 프레임 -->
  <div class="hud" aria-hidden="true">
    <span class="hud-corner hud-tl">DKDLQODDI · LOG</span>
    <span class="hud-corner hud-tr">EST 2026</span>
    <span class="hud-corner hud-bl">◦ EVA VIEW</span>
    <span class="hud-corner hud-br">+</span>
  </div>

  <!-- 검은 우주의 흰 별 (장식) -->
  <div class="stars" aria-hidden="true"></div>

  <!-- 흰 우주선 (장식) -->
  <div class="ship" aria-hidden="true">
    <svg viewBox="0 0 150 60" xmlns="http://www.w3.org/2000/svg">
      <line x1="4" y1="30" x2="24" y2="30" stroke="#fcfcfb" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 9" opacity="0.5"/>
      <path d="M52 17 L37 6 L45 20 Z" fill="#fcfcfb"/>
      <path d="M52 43 L37 54 L45 40 Z" fill="#fcfcfb"/>
      <rect x="27" y="24" width="9" height="12" rx="3" fill="#fcfcfb"/>
      <path d="M34 30c0-8.8 7.2-16 16-16h40c22 0 42 9 50 16-8 7-28 16-50 16H50c-8.8 0-16-7.2-16-16Z" fill="#fcfcfb"/>
      <circle cx="104" cy="30" r="6.5" fill="none" stroke="#0e0e0e" stroke-width="2.6"/>
    </svg>
  </div>

  <header class="hero">
    <p class="eyebrow mono">PRESENTATION LOG — 발표자료 모음</p>
    <h1 class="title">발표 기록</h1>
    <p class="tagline">아래 목록에서 발표자료를 선택하면 해당 슬라이드로 이동합니다.</p>
    <p class="scroll-cue mono" aria-hidden="true">SCROLL <span class="cue-arrow">↓</span></p>
  </header>

  <main>
    <section class="log" aria-labelledby="log-heading">
      <div class="log-head">
        <h2 id="log-heading" class="mono">LOG INDEX</h2>
        <span class="log-rule" aria-hidden="true"></span>
        <span id="log-count" class="mono log-count"></span>
      </div>
      <ol class="cards" id="cards"></ol>
      <p class="status mono" id="status" hidden></p>
      <noscript>
        <p class="status mono">목록 표시에는 자바스크립트가 필요합니다. 주소창에 slides/발표이름/ 을 직접 입력해도 열 수 있습니다.</p>
      </noscript>
    </section>
  </main>

  <footer class="site-foot mono">
    <span>37.53°N · 127.02°E</span>
    <span class="foot-sep" aria-hidden="true">─────</span>
    <span>SYS OK</span>
  </footer>

  <script src="main.js" defer></script>
</body>
</html>
