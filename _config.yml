content:
  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        border: weak  # Value of `weak` will display a weak border below this item. # Any 
                      # other value (or no value) means no border will be displayed
        title: RTOS on REBEL Quad
        link: https://rebellions.ai/ko/rebellions-product/rebel-quad/
        link_text: REBEL Quad
        quote: >
          The latest NPU that integrates four chiplets into a single package
        description: | # this will include new lines to allow paragraphs
          I had the opportunity to contribute to the development of REBEL Quad,
          Rebellions’ latest NPU that integrates four chiplets into a single package.
          Specifically, I participated in the development of the RTOS and device drivers
          for the REBEL Quad chip, enabling efficient operation and hardware–software integration
          of this cutting-edge technology.
      - layout: left
        border: weak
        title: Web viewer
        quote: >
          On-premise web page
        description: |
          I developed a web application using Next.js, Tailwind CSS, and Material-UI
          that operates in an on-premise environment without internet access.
          The system allows users to browse the database and generate data on a remote server,
          providing a secure and efficient solution tailored to restricted network conditions.
      - layout: left
        border: weak
        title: Controlling remote boards
        quote: >
          Combination of Ubuntu Server and IoT device
        description: |
          I built a remote board control system by utilizing an Ubuntu server and T32 driver,
          enabling efficient software-based management. In addition, I implemented control of
          hardware components that could not be managed purely through software by integrating
          Arduino and servo motors, ensuring comprehensive and reliable system operation.
