          - Developed automation tools with Python and SQL databases.
          - Created chip design tools using Python (PyQt)
          and web stack (React, TypeScript, Next.js, PostgreSQL).
          - Ported and developed software for ARM Cortex-A/M platforms.
          - Developed and debugged Linux device drivers.
      - layout: left
        title: SEC Laboratory
        sub_title: System Development Team
