        description: |
          Designed and implemented a real-time digital signal processing system 
          for Software Defined Radio (SDR) using GNU Radio and CPython. 
          The project focused on integrating legacy C programs with modern 
          signal processing frameworks and coordinating distributed hardware resources.
          - Connected legacy C files and GNU Radio through CPython bindings 
            and dynamic libraries.
          - Developed automation for real-time SDR programs that controlled 
            distributed servers and antennas across the country.
