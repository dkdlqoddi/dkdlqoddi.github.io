<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>우리 동네 책모임 — 실습 완성 예시</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: white; color: #182f24; }
    main { width: min(820px, 100%); margin: 0 auto; padding: 60px 36px; }
    .label { display: inline-block; font-size: 22px; background: #ecf3e6; border-radius: 100px; padding: 10px 18px; }
    h1 { font-size: clamp(48px, 10vw, 88px); line-height: 1.1; letter-spacing: -.06em; margin: 32px 0; }
    .books { display: flex; gap: 16px; align-items: flex-end; height: 185px; padding: 20px; margin: 36px 0; background: #f1f5e9; border-radius: 24px; }
    .books i { display: block; width: 70px; height: 130px; border-radius: 4px 9px 9px 4px; background: #285d48; border-left: 8px solid #194330; transform: rotate(-8deg); }
    .books i:nth-child(2) { background: #e3ad67; border-color: #bd8747; height: 143px; transform: rotate(4deg); }
    .books i:nth-child(3) { background: #c5b5df; border-color: #9984b9; height: 117px; transform: rotate(15deg); }
    dl { display: grid; grid-template-columns: 90px 1fr; gap: 22px 20px; font-size: 30px; line-height: 1.5; padding: 30px 0; margin: 0; border-top: 1px solid #d4decf; border-bottom: 1px solid #d4decf; }
    dt { color: #50634e; }
    dd { margin: 0; font-weight: 650; }
    .invitation { font-size: 30px; line-height: 1.6; margin: 28px 0; }
    footer { font-size: 19px; color: #5e685c; line-height: 1.6; margin-top: 42px; }
    @media (max-width: 480px) { main { padding: 36px 24px; } dl { grid-template-columns: 1fr; gap: 6px; font-size: 28px; } dd { margin-bottom: 17px; } .invitation { font-size: 27px; } }
    @media print { main { padding: 20px; } * { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
  </style>
</head>
<body>
  <main>
    <span class="label">함께 읽는 즐거움</span>
    <h1>우리 동네<br>책모임</h1>
    <div class="books" aria-hidden="true"><i></i><i></i><i></i></div>
    <dl><dt>언제</dt><dd>10월 10일 · 오후 2시</dd><dt>어디서</dt><dd>동네 도서관 2층</dd></dl>
    <p class="invitation">책 한 권, 편안한 마음.<br>함께 읽고 이야기를 나눠요.</p>
    <footer>AI 도구 입문 수업의 실습 예시입니다.<br>실제로 열리는 행사가 아닌 가상의 모임입니다.</footer>
  </main>
</body>
</html>
