<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 발표 기록</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <!-- Root URLs work even when GitHub Pages serves this at a deeply nested URL.
       Inline defaults keep the error page readable if assets are unavailable. -->
  <style>
    :root { --paper: #fff; --ink: #182320; --muted: #626a65; --forest: #285d48; --lime: #ddf59a; --line: #dce1db; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; }
    .error-page { min-height: 100dvh; display: grid; place-content: center; justify-items: center; padding: 110px 24px 70px; text-align: center; }
    .error-mark { display: grid; place-items: center; width: 95px; height: 95px; background: var(--lime); border-radius: 27px; font-size: 78px; transform: rotate(-7deg); }
    .error-code { color: var(--forest); font-size: 13px; letter-spacing: .12em; margin: 34px 0 12px; }
    .error-page h1 { font-size: clamp(32px, 6vw, 55px); letter-spacing: -.06em; margin: 0 0 20px; }
    .error-page p:not(.error-code) { max-width: 32em; line-height: 1.8; color: var(--muted); margin: 0 0 30px; }
    .error-link { display: inline-block; padding: 14px 22px; color: white; background: var(--forest); border-radius: 11px; text-decoration: none; }
    a:focus-visible { outline: 3px solid #566fc3; outline-offset: 5px; }
  </style>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/pretendard/pretendard.css">
  <link rel="stylesheet" href="/assets/theme.css">
</head>
<body data-template="site">
  <main id="main" class="error-page">
    <span class="error-mark" aria-hidden="true">↗</span>
    <p class="error-code">404 · PAGE NOT FOUND</p>
    <h1>잠시, 길을 벗어났네요.</h1>
    <p>요청한 주소에 발표 자료가 없습니다.<br>첫 화면에서 찾고 있던 이야기를 만나보세요.</p>
    <a class="error-link" href="/">발표 기록으로 돌아가기 ↗</a>
  </main>
  <script src="/assets/template.js" defer></script>
  <script>if (location.protocol === 'file:') document.querySelector('.error-link').href = './index.html';</script>
</body>
</html>
