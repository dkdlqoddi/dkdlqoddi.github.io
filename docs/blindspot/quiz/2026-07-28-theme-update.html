<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-Merge Quiz: 테마 업데이트</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
  .q { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
  .q.correct { border-color: #2e7d32; background: #edf7ed; }
  .q.wrong { border-color: #c62828; background: #fdecea; }
  #result { font-size: 1.2rem; font-weight: bold; margin: 1rem 0; }
  button { padding: .6rem 1.2rem; font-size: 1rem; cursor: pointer; }
  .summary { background: #f5f5f5; border-radius: 8px; padding: 1rem; }
  label { display: block; }
  label.answer { color: #2e7d32; font-weight: bold; }
  .explain { background: #fff8e1; border-radius: 6px; padding: .5rem .8rem; margin-top: .5rem; }
</style>
</head>
<body>
<h1>Pre-Merge Quiz: 테마 업데이트</h1>
<div class="summary">
<h2>변경 요약</h2>
<p>메인 페이지와 모든 발표 자료에 새로운 영문 폰트인 몬세라트를 적용했습니다. 화면의 주요 색상을 보라색에서 흰색과 회색으로 바꿨습니다. 메인 화면의 외곽선과 네모난 상자들의 테두리를 더 굵게 그렸습니다. 글꼴이 찌그러지지 않고 선명하게 보이도록 부드럽게 다듬는 처리를 더했습니다.</p>
</div>
<h2>퀴즈 — 전부 맞혀야 머지 가능</h2>
<p>답을 고르는 데 필요한 내용은 위 '변경 요약'에 모두 들어 있습니다.</p>
<div id="quiz"></div>
<button onclick="grade()">정답 확인</button>
<div id="result"></div>
<script>
const QUESTIONS = [
  { q: "이번 업데이트 이후 사이트 전체의 주요 색상은 어떻게 변하나요?",
    options: ["파란색과 노란색으로 바뀐다", "기존의 보라색 계열을 유지한다", "무채색인 흰색과 회색으로 바뀐다"], answer: 2,
    explain: "기존 보라색 계열의 포인트 색상이 무채색(흰색, 회색) 기반으로 완전히 변경되었습니다. 테마의 인상을 차분하게 만들기 위한 수정입니다." },
  { q: "새로 추가된 영문 폰트로 인해 발생할 수 있는 변화는 무엇인가요?",
    options: ["한글 글씨체가 모두 새 폰트로 대체된다", "영문 텍스트에 새로운 글꼴이 적용된다", "웹 브라우저의 기본 폰트 설정이 지워진다"], answer: 1,
    explain: "추가된 몬세라트는 영문 폰트이므로 영문 텍스트의 형태만 먼저 바뀝니다. 한글은 기존의 글꼴(Pretendard)을 그대로 유지합니다." },
  { q: "화면에 그려지는 상자나 외곽선 영역에는 어떤 시각적인 변화가 생기나요?",
    options: ["상자의 테두리가 두꺼워진다", "모든 상자의 테두리가 없어진다", "외곽선 영역이 기존보다 좁아진다"], answer: 0,
    explain: "디자인 변경에 따라 얇았던 테두리를 더 굵게 적용했습니다. 또한 외곽선의 간격도 넓혀서 좁아지지 않았습니다." },
  { q: "글꼴이 화면에 나타날 때 어떤 개선이 이루어지나요?",
    options: ["애니메이션 효과가 새롭게 적용된다", "부드럽게 다듬어 선명하게 보이도록 처리된다", "글자 크기가 전체적으로 훨씬 커진다"], answer: 1,
    explain: "어두운 화면에서 얇은 글꼴이 뭉개지는 것을 막기 위해, 시스템에 폰트를 렌더링할 때 선명하게 보이도록 스무딩 처리를 추가했습니다." }
];
const quiz = document.getElementById("quiz");
QUESTIONS.forEach((it, i) => {
  const d = document.createElement("div");
  d.className = "q"; d.id = "q" + i;
  d.innerHTML = "<p><b>Q" + (i + 1) + ".</b> " + it.q + "</p>" +
    it.options.map((o, j) =>
      '<label><input type="radio" name="q' + i + '" value="' + j + '"> ' + o + "</label>"
    ).join("") +
    '<div class="explain" hidden><b>해설.</b> ' + it.explain + "</div>";
  quiz.appendChild(d);
});
function grade() {
  let ok = 0;
  QUESTIONS.forEach((it, i) => {
    const sel = document.querySelector('input[name="q' + i + '"]:checked');
    const el = document.getElementById("q" + i);
    const good = sel && Number(sel.value) === it.answer;
    el.className = "q " + (good ? "correct" : "wrong");
    el.querySelectorAll("label")[it.answer].classList.add("answer");
    el.querySelector(".explain").hidden = false;
    if (good) ok++;
  });
  const r = document.getElementById("result");
  r.textContent = ok === QUESTIONS.length
    ? "통과 (" + ok + "/" + QUESTIONS.length + ") — 머지 가능"
    : "미통과 (" + ok + "/" + QUESTIONS.length + ") — 오답 확인 후 재시도. 머지 금지";
}
</script>
</body>
</html>
